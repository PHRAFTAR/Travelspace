<!DOCTYPE html>
<html lang="en">
<head>
    <script>(function(){var t=localStorage.getItem('ts_theme');if(t==='light')document.documentElement.setAttribute('data-theme','light');})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album - TravelSpace</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="assets/js/config.js"></script>
    <script src="assets/js/github-api.js"></script>
    <script src="assets/js/app.js" defer></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>TravelSpace</h1>
            <nav>
                <div class="menu-icon"><i class="fas fa-bars"></i></div>
                <ul class="nav-list">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="upload.html" class="theme-toggle" title="Upload / Manage"><i class="fas fa-cloud-upload-alt"></i></a></li>
                    <li><button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle light/dark theme"><i class="fas fa-sun"></i></button></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <section class="section">
            <div class="section-head reveal">
                <div>
                    <p class="section-eyebrow"><a href="gallery.html" style="color:inherit;text-decoration:none">&larr; All Albums</a></p>
                    <h2 id="album-title">Loading…</h2>
                </div>
                <p class="section-sub" id="album-meta"></p>
            </div>
            <div class="contact-sheet" id="contact-sheet">
                <p class="empty-state">Loading photos…</p>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer-inner">
            <div class="footer-stamp"><i class="fas fa-plane"></i></div>
            <p class="footer-tagline"><i class="fas fa-plane"></i> Collect moments. Not things.</p>
            <div class="social-icons">
                <a href="https://www.facebook.com/priyanshu.deepu.5?mibextid=qi2Omg&rdid=Tq0yEKBLqfZ9Apvh&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F4V6339T38sKLmu1P%2F%3Fmibextid%3Dqi2Omg"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.youtube.com/@ph_raftar"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/ph_raftar/"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-linkedin-in"></i></a>
            </div>
        </div>
        <p class="footer-copy">&copy; 2024 TravelSpace. All rights reserved.</p>
    </footer>

    <div id="myModal" class="modal">
        <span class="close">&times;</span>
        <span class="modal-nav modal-prev"><i class="fas fa-chevron-left"></i></span>
        <img class="modal-content" id="img01">
        <span class="modal-nav modal-next"><i class="fas fa-chevron-right"></i></span>
        <span class="modal-counter" id="modal-counter">01 / 01</span>
    </div>

    <div id="deleteAuthModal" class="modal">
        <div class="upload-card" style="max-width:380px; margin:0; width:90%;">
            <h3><i class="fas fa-lock"></i> Unlock to Delete</h3>
            <p class="hint">Enter your passphrase to confirm this delete.</p>
            <input type="password" id="delete-pass-input" placeholder="Passphrase" style="margin-bottom:1rem;">
            <div style="display:flex; gap:0.6rem;">
                <button class="btn" id="delete-pass-confirm" type="button">Unlock</button>
                <button class="btn secondary" id="delete-pass-cancel" type="button">Cancel</button>
            </div>
            <p id="delete-pass-error" style="color:var(--stamp); font-size:0.8rem; margin:0.8rem 0 0;"></p>
        </div>
    </div>
</body>
</html>
